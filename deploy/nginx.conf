# Lab Companion — nginx alternative to the Caddyfile (same headers and caching).
# Put this in /etc/nginx/sites-available/lab-companion, link it into sites-enabled, then get a
# certificate with certbot:  sudo certbot --nginx -d lab.example.org
# HTTPS is required for the service worker (offline mode), Wake Lock and installing the app.

# hashed build output never changes; everything else keeps its name across deploys → revalidate
map $uri $lab_cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 80;
    listen [::]:80;
    server_name lab.example.org;            # ← your domain
    root /srv/lab-companion;
    index index.html;
    server_tokens off;

    # Optional: keep the site to the team (sudo htpasswd -c /etc/nginx/lab.htpasswd team)
    # auth_basic "Lab Companion";
    # auth_basic_user_file /etc/nginx/lab.htpasswd;

    types {
        text/html html;
        text/css css;
        application/javascript js;
        text/javascript mjs;
        application/json json;
        application/wasm wasm;
        application/zip zip whl;
        application/manifest+json webmanifest;
        image/svg+xml svg;
        image/png png;
        font/woff2 woff2;
        font/woff woff;
        font/ttf ttf;
    }

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json application/wasm application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    # one set of headers for every response (no add_header inside location blocks: nginx would
    # drop these there). Keep the CSP identical to deploy/Caddyfile, which web/tests/e2e/csp.spec.ts tests.
    add_header Cache-Control $lab_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

    # hash routing (#/exp/5/run): every page is index.html
    location / {
        try_files $uri /index.html;
    }
}
