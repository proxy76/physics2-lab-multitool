[project]
name = "labcalc"
version = "1.0.0"
description = "High-precision computation engine for the Physics 2 Lab Companion"
requires-python = ">=3.12"
dependencies = ["mpmath==1.3.0"]

[project.optional-dependencies]
symbolic = ["sympy==1.14.0"]
test = ["pytest", "hypothesis", "numpy", "scipy", "uncertainties", "sympy==1.14.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["labcalc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: statistical coverage tests (1000 seeded trials)"]
