name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the brief's version; 3.14 is what Pyodide runs in the browser (D2)
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - run: pip install -e "engine[test]"
      # NIST StRD, cross-checks, golden datasets, rounding, parsing, dps 50 vs 100, answer snapshots
      - name: Tests
        working-directory: engine
        run: pytest -q -m "not slow"
      # 1000-trial coverage tests (honest uncertainties), once
      - name: Coverage tests (slow)
        if: matrix.python == '3.12'
        working-directory: engine
        run: pytest -q -m slow

  web:
    name: Web (unit, build, Pyodide, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # the engine package runs inside the real Pyodide runtime
      - run: npm run test:pyodide
      - run: npx playwright install --with-deps chromium
      - name: e2e (vite preview)
        run: npm run e2e
      # the same suite against the production Caddyfile (headers, MIME types, CSP)
      - name: e2e (Caddy, production config)
        run: |
          curl -sSL https://github.com/caddyserver/caddy/releases/download/v2.11.7/caddy_2.11.7_linux_amd64.tar.gz | tar xz caddy
          export LAB_DOMAIN=":8088" LAB_ROOT="$PWD/dist"
          ./caddy validate --config ../deploy/Caddyfile --adapter caddyfile
          ./caddy start --config ../deploy/Caddyfile --adapter caddyfile
          BASE_URL=http://localhost:8088/ npx playwright test
          ./caddy stop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile -t lab-companion .
      - name: Smoke test
        run: |
          docker run -d --name lab -p 8080:80 lab-companion
          for i in $(seq 1 20); do curl -fs http://localhost:8080/ >/dev/null && break; sleep 1; done
          curl -fsI http://localhost:8080/pyodide/pyodide.asm.wasm | grep -i "content-type: application/wasm"
          curl -fs http://localhost:8080/ | grep -q "Lab Companion"
